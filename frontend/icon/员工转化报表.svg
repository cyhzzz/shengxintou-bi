    <path d="M12,15 C12,12 13.5,10 15,10 C16.5,10 18,12 18,15" fill="#A3ADC4" opacity="0.7"/>

    <!-- 增长标识 -->
    <path d="M15,4 L16.5,6 L15.5,6 L15.5,8 L14.5,8 L14.5,6 L13.5,6 Z" fill="#55698F" opacity="0.6"/>
  </g>
</svg>