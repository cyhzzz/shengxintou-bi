<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" class="design-iconfont">
  <g fill="none" fill-rule="evenodd">
    <!-- 背景圆环 -->
    <circle cx="10" cy="10" r="8" fill="#D2DAE8" opacity="0.4"/>

    <!-- 左侧人员图标 -->
    <circle cx="6" cy="7" r="2.5" fill="#A3ADC4"/>
    <path d="M3,15 C3,12 4.5,10 6,10 C7.5,10 9,12 9,15" fill="#55698F" opacity="0.7"/>

    <!-- 转化箭头 -->
    <path d="M9.5,10 L12,10 L11,8 L13.5,10.5 L11,13 L12,11 L9.5,11 Z" fill="#55698F"/>

    <!-- 右侧转化后人员（带增长标识） -->
