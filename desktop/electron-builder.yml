appId: com.shengxintou.bi
productName: 省心投 BI
copyright: Copyright © 2026 省心投 BI
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
# B 阶段：PyInstaller 打包的 server.exe 已包含全部 Python 依赖，
# 用户机器零 Python 依赖即可运行。
extraResources:
  - from: ../app.py
    to: app.py
  - from: ../config.py
    to: config.py
  - from: ../backend
    to: backend
  - from: ../frontend-react/dist
    to: frontend-react/dist
  # v3.5.8 安全修复：不再打包含真实凭据的 .env.desktop
  # 安装后 .env 不存在，后端按 config.py 默认值启动（SQLite / 无鉴权 / 无 WebDAV）
  # 用户要启用坚果云备份/Supabase 时，复制 .env.example 为 .env 并填写自己的凭据
  - from: ../.env.example
    to: .env.example
  - from: ../version.json
    to: version.json
  - from: ../icon/LOGO.ico
    to: icon/LOGO.ico
  # PyInstaller onedir 产物（含 server.exe + _internal/）
  - from: ../dist/server
    to: server
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 省心投 BI
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
