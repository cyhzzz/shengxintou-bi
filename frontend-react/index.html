<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" id="viewport-meta" />
    <!-- v3.6.2：PWA 模式（部署在 /app/ 子路径）放宽 viewport，允许缩放
         解决 Android 浏览器输入框无法唤起输入法的问题
         （user-scalable=no + Antd Modal transform 在 Android Chrome 上有已知 bug：
          input 在带 transform 的 fixed 容器内 + 禁用缩放 → 键盘不弹出）
         iOS Safari 早就忽略 user-scalable=no，所以放宽对 iOS 无影响
         Android APK 原生应用感来自 Capacitor WebView 设置，不依赖 viewport meta -->
    <script>
      (function () {
        if (window.location.pathname.indexOf('/app/') !== -1) {
          var meta = document.getElementById('viewport-meta');
          if (meta) meta.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
        }
      })();
    </script>
    <title>省心投平台 - 互联网广告投放分析平台</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- v3.6.2：PWA manifest（仅 PWA 模式生效，Web/桌面版忽略） -->
    <link rel="manifest" href="manifest.json">
    <!-- v3.6.2：iOS Safari PWA 专属 meta（添加到主屏后生效） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="省心投">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
