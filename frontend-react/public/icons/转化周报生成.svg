<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" class="design-iconfont">
  <g fill="none" fill-rule="evenodd">
    <!-- 文档背景 -->
    <rect x="4" y="3" width="12" height="14" rx="1" fill="#D2DAE8" opacity="0.6"/>

    <!-- 文档主体 -->
    <rect x="5" y="4" width="10" height="12" rx="1" fill="#A3ADC4" opacity="0.7"/>

    <!-- 周报标题区域 -->
    <rect x="6" y="5" width="8" height="2" rx="0.3" fill="#55698F" opacity="0.5"/>

    <!-- 日历/周标识 -->
    <rect x="6" y="8" width="3" height="2" rx="0.3" fill="#55698F" opacity="0.6"/>
    <rect x="10" y="8" width="4" height="2" rx="0.3" fill="#D2DAE8" opacity="0.8"/>

    <!-- 数据行 -->
    <line x1="6" y1="11.5" x2="14" y2="11.5" stroke="#55698F" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <line x1="6" y1="13" x2="12" y2="13" stroke="#55698F" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

    <!-- 生成标识 - 齿轮 -->
    <circle cx="14" cy="13" r="2.5" fill="#55698F"/>
    <circle cx="14" cy="13" r="1" fill="#A3ADC4"/>
    <!-- 齿轮齿 -->
    <rect x="13.5" y="10" width="1" height="1" fill="#55698F"/>
    <rect x="13.5" y="15" width="1" height="1" fill="#55698F"/>
    <rect x="11" y="12.5" width="1" height="1" fill="#55698F"/>
    <rect x="16" y="12.5" width="1" height="1" fill="#55698F"/>

    <!-- 增长箭头标识 -->
    <path d="M7,14 L8,13 L9,14" stroke="#55698F" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>