# Dependabot 配置：已禁用自动 PR（open-pull-requests-limit: 0）。
# 历史背景：项目维护者非程序员，Dependabot 自动开的 PR 无人 review 会堆积。
# 保留配置文件 + ignore 规则，未来需要重启自动 PR 时把 limit 改回 5 即可。
# 配合 .github/workflows/ci.yml，PR 触发后会自动跑后端 smoke + 前端 typecheck/lint/build。

version: 2

updates:
  # Python 后端依赖（已禁用自动 PR）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"
      include: "scope"
    # pandas/numpy 是关键计算栈，主版本变更需手动 review
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Flask"
        update-types: ["version-update:semver-major"]

  # 前端 npm 依赖（已禁用自动 PR）
  - package-ecosystem: "npm"
    directory: "/frontend-react"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    # React / antd / Vite 主版本升级需手动 review
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "antd"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      antd-ecosystem:
        patterns:
          - "@ant-design/*"
          - "antd"
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "@types/*"
          - "eslint*"

  # GitHub Actions 版本（已禁用自动 PR）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "softprops/*"