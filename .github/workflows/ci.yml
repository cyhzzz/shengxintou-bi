name: CI

# 每次 push / PR 触发：检查规则架构、后端 smoke、前端 typecheck/lint/build，
# 保证规则不漂移、核心 API 正常返回且前端可构建。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rule-architecture:
    name: Rule architecture
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Validate AI rule architecture
        run: python scripts/check_rule_architecture.py

  backend-smoke:
    name: Backend API smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run API smoke
        env:
          DEV_MODE: "1"
          DATABASE_PATH: "database/ci-smoke.db"
        run: |
          python -m unittest discover -s tests/api -v

  frontend-build:
    name: Frontend typecheck + lint + build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install frontend deps
        working-directory: frontend-react
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        working-directory: frontend-react
        run: npm run typecheck
      - name: ESLint
        working-directory: frontend-react
        run: npm run lint
      - name: Production build
        working-directory: frontend-react
        run: npm run build

  setup-script-syntax:
    name: Setup script syntax check
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -c "import py_compile; py_compile.compile('scripts/setup.py', doraise=True)"
      - name: Node syntax
        run: node --check scripts/setup.mjs
      - name: Bash syntax
        shell: bash
        run: bash -n scripts/setup.sh
