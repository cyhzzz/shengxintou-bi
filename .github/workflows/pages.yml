name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # v3.8.5：打 tag v* 触发 release 时同步重建部署 PWA（与 release.yml 四端发版统一）。
    #   paths 加入 version.json：发版流程必改 version.json，保证 tag 提交必触发。
    tags: ['v*']
    paths:
      - 'website/**'
      - 'frontend-react/**'
      - 'skills/**'
      - '.github/workflows/pages.yml'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # tag 推送不部署 Pages（github-pages 环境禁止 tag 部署），仅 main 分支推送部署
    if: github.ref_type == 'branch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Build PWA (mode=pwa, base=/app/)
        working-directory: frontend-react
        run: npm run build:pwa

      - name: Assemble Pages artifact
        # 官网放 /，PWA 放 /app/
        run: |
          set -e
          mkdir -p staging/app
          cp -r website/* staging/
          cp -r frontend-react/dist/* staging/app/
          # 生成 Skill 独立下载包（业务同事/数据助手用），每次随源码打包避免与技能内容不同步
          python - <<'EOF'
          import os, zipfile
          src = 'skills/shengxintou-bi-rules'
          dst = 'staging/shengxintou-bi-rules.zip'
          if os.path.exists(dst):
              os.remove(dst)
          with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _dirs, files in os.walk(src):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, arcname=p.replace('skills' + os.sep, '', 1))
          EOF
          # 确保有 .nojekyll（避免 GitHub Pages 忽略 _ 开头的文件）
          touch staging/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
